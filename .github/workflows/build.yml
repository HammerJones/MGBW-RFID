# Tests the Rust core and builds the Android APK on GitHub's free runners.
# Open the Actions tab, pick the latest run, and download "snowtrack-android".
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Test the Rust core
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test -p snowtrack-core 2>&1 | tee test.log; then
            msg=$(grep -E "panicked|FAILED|^error|assertion" test.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Rust tests failed::${msg}"
            exit 1
          fi

      # Runs the core against the real NOAA, SNOTEL and news services. An outage
      # there should not fail the build, so this step only reports.
      - name: Live data check (Vail, Alta, Killington)
        continue-on-error: true
        run: |
          for r in vail alta killington; do
            echo "::group::$r"
            cargo run -q -p snowtrack-core --bin snowtrack -- "$r" || echo "::warning title=Live data check::$r failed"
            echo "::endgroup::"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - run: cargo install cargo-ndk --locked

      # Keep the same signing key between builds so new versions install over old ones.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: android/snowtrack.keystore
          key: snowtrack-signing-key-v1
      - name: Make a signing key (first build only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          echo "::warning title=New signing key::This APK is signed with a NEW key, so it won't install over a previous version. Uninstall SnowTrack first, then install this one."
          keytool -genkeypair -keystore android/snowtrack.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SnowTrack"

      - name: Build the Rust library and Kotlin bindings
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          set -o pipefail
          if ! ./scripts/build-android.sh 2>&1 | tee rust.log; then
            msg=$(grep -v "^ *Compiling\|^ *Downloaded\|^ *Downloading" rust.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Rust Android build failed::${msg}"
            exit 1
          fi

      - name: Build APK
        shell: bash
        working-directory: android
        env:
          SNOWTRACK_KEYSTORE: ${{ github.workspace }}/android/snowtrack.keystore
        run: |
          set -o pipefail
          if ! gradle testReleaseUnitTest assembleRelease --no-daemon --console=plain -PversionCode=${{ github.run_number }} 2>&1 | tee gradle.log; then
            msg=$(grep -E "^e: |error:|ERROR|What went wrong|FAILED|Exception|^> |Could not|Unresolved" gradle.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi
          mkdir -p ../apk && cp app/build/outputs/apk/release/*.apk ../apk/SnowTrack.apk
          ls -la ../apk
      - uses: actions/upload-artifact@v4
        with:
          name: snowtrack-android
          path: apk/SnowTrack.apk

  # Installs the app on an emulator, adds a resort and saves screenshots.
  # Never blocks the APK: it is a look at the running app, not a gate.
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: emulator
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - run: cargo install cargo-ndk --locked
      - name: Build an emulator APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          keytool -genkeypair -keystore android/snowtrack.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SnowTrack"
          ABI=x86_64 ./scripts/build-android.sh
          cd android && SNOWTRACK_KEYSTORE=$PWD/snowtrack.keystore gradle assembleRelease --no-daemon --console=plain -Pabi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ui-smoke.sh android/app/build/outputs/apk/release/app-release.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowtrack-screenshots
          path: shots
      # Also keep the latest screenshots on their own branch so they can be
      # viewed on GitHub without downloading anything.
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
