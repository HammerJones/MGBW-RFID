[package]
name = "snowtrack-core"
version = "0.1.0"
edition = "2021"
description = "Snowfall tracking and forecasting for ski resorts from NOAA/NWS, SNOTEL and news feeds"
license = "MIT"

[lib]
name = "snowtrack_core"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[[bin]]
name = "snowtrack"
path = "src/bin/snowtrack.rs"

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
quick-xml = "0.42"
regex-lite = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
